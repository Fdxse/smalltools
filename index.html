<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  /* Colours follow the same scheme as bitwise-table.html, with a dark mode. */
  :root {
    --page-background: #f3f5f8;
    --panel-background: #ffffff;
    --text-color: #1b2230;
    --muted-text-color: #5b6477;
    --border-color: #d6dbe4;
    --accent-color: #2457d6;
    --body-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-background: #13161c;
      --panel-background: #1c2028;
      --text-color: #e5e8ee;
      --muted-text-color: #98a1b3;
      --border-color: #323947;
      --accent-color: #7ea2ff;
    }
  }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--page-background);
    color: var(--text-color);
    font-family: var(--body-font);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  #file-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--panel-background);
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
  #file-list li + li { border-top: 1px solid var(--border-color); }
  #file-list a {
    display: block;
    padding: 12px 16px;
    color: var(--accent-color);
    text-decoration: none;
    font-weight: 500;
  }
  #file-list a:hover { text-decoration: underline; }
  #status-message { color: var(--muted-text-color); font-size: 0.9rem; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Tools</h1>
  <ul id="file-list"></ul>
  <p id="status-message"></p>
</main>

<script>
  /*
   * The list of tools lives in tools.json, next to this page.
   * Each entry needs "file" (the file name) and can have "title" (the link text).
   * Without a title, the text is made from the file name:
   * "bitwise-table.html" -> "Bitwise Table".
   *
   * Note: browsers block fetch() over file://, so this page must be opened
   * through a web server (http:// or https://) to read tools.json.
   */
  const toolsFileName = "tools.json";

  /**
   * Turns a file name into a readable title.
   * Hyphens, underscores and dots become spaces, and each word gets a capital letter.
   */
  function fileNameToTitle(fileName) {
    const nameWithoutExtension = fileName.replace(/\.html?$/i, "");
    const words = nameWithoutExtension.split(/[-_.\s]+/).filter(word => word.length > 0);
    const capitalisedWords = words.map(word => word.charAt(0).toUpperCase() + word.slice(1));
    return capitalisedWords.join(" ");
  }

  /** Loads tools.json and returns its list of tool entries. */
  async function loadToolEntries() {
    // no-cache so an edited tools.json shows up on the next reload.
    const toolsResponse = await fetch(toolsFileName, { cache: "no-cache" });
    if (!toolsResponse.ok) {
      throw new Error(toolsFileName + " could not be loaded (server answered " + toolsResponse.status + ").");
    }
    const toolEntries = await toolsResponse.json();
    if (!Array.isArray(toolEntries)) {
      throw new Error(toolsFileName + " must contain a list: [ { \"file\": \"...\" }, ... ]");
    }
    return toolEntries;
  }

  /** Draws one link per tool, in the order they appear in tools.json. */
  function renderToolLinks(toolEntries) {
    const fileListElement = document.getElementById("file-list");
    fileListElement.replaceChildren();

    for (const toolEntry of toolEntries) {
      // Skip entries without a file name instead of drawing a broken link.
      if (!toolEntry || typeof toolEntry.file !== "string" || toolEntry.file.trim() === "") continue;

      const listItemElement = document.createElement("li");
      const linkElement = document.createElement("a");
      // encodeURI keeps names with spaces working, and still allows sub/folder paths.
      linkElement.href = encodeURI(toolEntry.file);
      linkElement.textContent = toolEntry.title || fileNameToTitle(toolEntry.file.split("/").pop());
      listItemElement.appendChild(linkElement);
      fileListElement.appendChild(listItemElement);
    }
  }

  /** Entry point: load the list and draw it, or explain what went wrong. */
  async function buildIndex() {
    const statusElement = document.getElementById("status-message");
    try {
      renderToolLinks(await loadToolEntries());
      statusElement.textContent = "";
    } catch (loadError) {
      statusElement.textContent = window.location.protocol === "file:"
        ? "This page reads " + toolsFileName + ", which browsers don't allow over file://. Open it through a web server instead."
        : "Could not read the tool list: " + loadError.message;
    }
  }

  buildIndex();
</script>
</body>
</html>
